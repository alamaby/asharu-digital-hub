name: Scrape affiliate products

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:00 UTC (= 10:00 WIB). Concurrency group below prevents
    # overlapping runs; no git push happens in this workflow anymore.
    - cron: '0 3 * * *'

# Prevent concurrent scrape runs trampling each other's file/DB writes.
concurrency:
  group: scrape-affiliate
  cancel-in-progress: false

jobs:
  scrape:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape affiliate products
        # No --insecure: CI uses a clean network with valid certificates.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run scrape:affiliate

      - name: Verify image assets exist
        # Guard 2026-09-12 + 2026-09-15: setiap baris aktif WAJIB menunjuk URL
        # bucket affiliate-images (M4 DB-only). URL remote lain (mis. CDN
        # Shopee — insiden 2026-09-15: 240 baris) langsung merah.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module -e "
          import { createClient } from '@supabase/supabase-js';
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SECRET_KEY, { auth: { persistSession: false } });
          const { data, error } = await supabase.from('affiliate_products').select('external_id, image').eq('is_active', true);
          if (error) { console.error('::error::asset check query failed: ' + error.message); process.exit(1); }
          const rows = data || [];
          const invalid = rows.filter((r) => !r.image || !String(r.image).includes('.supabase.co/storage/'));
          if (invalid.length > 0) { console.error('::error::non-Storage image refs (must be affiliate-images bucket URLs): ' + invalid.length + ' e.g. ' + invalid.slice(0, 3).map((r) => r.external_id + ':' + String(r.image).slice(0, 80)).join(' | ')); process.exit(1); }
          const sample = rows.slice(0, Math.min(rows.length, 20));
          for (const r of sample) {
            const url = new URL(r.image);
            const path = url.pathname.replace('/storage/v1/object/public/affiliate-images/', '');
            const { data: exists } = await supabase.storage.from('affiliate-images').exists(path);
            if (!exists) { console.error('::error::missing Storage image: ' + r.image); process.exit(1); }
          }
          console.log('asset check ok: ' + rows.length + ' active rows, all Storage images, sample exists verified.');
          "

      - name: Verify DB sync (self-consistency)
        # Assert the DB is self-consistent post-scrape: active>0, featured==6,
        # no NULL/empty images.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module -e "
          import { createClient } from '@supabase/supabase-js';
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SECRET_KEY, { auth: { persistSession: false } });
          const { data, error } = await supabase.from('affiliate_products').select('is_active, is_featured, image', { count: 'exact' });
          if (error) { console.error('::error::drift check query failed: ' + error.message); process.exit(1); }
          const rows = data || [];
          const active = rows.filter((r) => r.is_active);
          const featured = active.filter((r) => r.is_featured);
          const broken = active.filter((r) => !r.image);
          if (active.length === 0) { console.error('::error::DB has no active affiliate_products'); process.exit(1); }
          if (featured.length !== 6) { console.error('::error::featured count !== 6: ' + featured.length); process.exit(1); }
          if (broken.length > 0) { console.error('::error::broken (NULL image) active rows: ' + broken.length); process.exit(1); }
          console.log('drift check ok: ' + active.length + ' active, ' + featured.length + ' featured, 0 broken images.');
          "

      - name: Revalidate public catalog cache
        # Baris affiliate_products ditulis via service key (bukan Server Action),
        # sehingga tidak ada revalidatePath yang terpanggil dan ISR `/id/produk`
        # + beranda bisa basi hingga 1 jam. Best-effort: kegagalan di sini tidak
        # menggagalkan scrape (data DB sudah benar, hanya cache publik tertunda).
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://asharu.id' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set — skipping on-demand revalidation (ISR 1h still applies)."
            exit 0
          fi
          curl -sS -X POST "$SITE_URL/api/revalidate/products" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -w '\nHTTP %{http_code}\n'

      - name: Validate scraper gates
        run: |
          npm run check:scraper
          npm run test:scrape

      - name: Report failure to error digest
        if: failure()
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://asharu.id' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set — skipping error digest report"
            exit 0
          fi
          curl -sS -X POST "$SITE_URL/api/notifications/report" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"category\":\"scrape\",\"source\":\"github-actions\",\"message\":\"Affiliate scrape workflow failed (run $GITHUB_RUN_ID)\"}" || true
          echo "::error::Affiliate scrape failed. Check the run logs."