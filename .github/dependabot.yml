version: 2

updates:
  # Aplikasi Next.js — dependency produksi & dev dipisah agar PR bisa direview
  # sesuai risiko (dev deps: test/build; prod deps: runtime publik).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # Actions di .github/workflows (checkout/setup-node) — update kecil tapi
  # sering jadi jalur masuk supply-chain.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Submodule migrasi Supabase (repo terpisah: asharu-supabase).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
